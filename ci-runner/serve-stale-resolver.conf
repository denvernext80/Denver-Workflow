# dw-ci egress 트랜션트 완화 — serve-stale 포워딩 리졸버 (unbound 드롭인)
#
# 왜: CI VM 의 DNS 는 OrbStack DNS 프록시(0.250.250.200) 하나로 나간다. 호스트 Mac 의 Wi-Fi
#     uplink 이 순간 끊기면(블립) 그 프록시는 «상류 도달실패»를 **NXDOMAIN(EAI_NONAME)** 으로
#     번역해 돌려준다 — checkout 의 "Set up job / Download action" 단계가 codeload 를 못 찾아
#     실패하고, 워크플로 retry 로는 못 막는다(액션 다운로드는 스텝 이전).
#
#     serve-expired(RFC 8767)는 상류가 «실패»(타임아웃/SERVFAIL)할 때 마지막 양호 A 레코드를
#     내주지만, **NXDOMAIN 은 «정상 응답»이라 serve-expired 가 발동하지 않는다**(로컬 unbound
#     1.19 시뮬로 실측 — DROP·SERVFAIL 은 stale 서빙, NXDOMAIN 은 그대로 통과). 따라서:
#       · 인터넷 이름(`.`) → OrbStack 프록시를 «우회»해 퍼블릭 리졸버로 직접. 블립 때 이 경로는
#         SYN 드롭 → 타임아웃 → serve-expired 발동 → 마지막 양호 A 서빙 → checkout 생존.
#       · OrbStack 내부 이름(`orb.local`) → 프록시 유지(VM/컨테이너/호스트 해석 보존).
#
# 배선: 플러그인 `_build/dw-wire-ci-runners.py` 가 `/etc/unbound/unbound.conf.d/zz-dw-ci-resolver.conf`
#       로 설치(멱등). `zz-` 접두는 include-toplevel 알파벳 병합에서 **마지막**에 실려 패키지
#       기본값(root-auto-trust-anchor-file.conf 등)을 덮는다. 검증: `unbound-checkconf`.
server:
    # 상류 실패(타임아웃/SERVFAIL) 시 만료된 캐시라도 마지막 양호 응답을 내준다.
    serve-expired: yes
    serve-expired-ttl: 86400
    # RFC 8767: 만료 후 상류를 최대 1.8s 기다렸다가 응답 없으면 stale 을 즉시 서빙.
    serve-expired-client-timeout: 1800
    serve-expired-reply-ttl: 30
    # 부정 캐시 차단 — 일시적 NXDOMAIN/SERVFAIL 이 캐시에 «고정»돼 블립 후에도 지속되는 것을 막는다.
    # (systemd-resolved 의 부정캐싱이 스퓨리어스 NXDOMAIN 을 고정시키는 악화 모드를 원천 배제.)
    cache-max-negative-ttl: 0
    neg-cache-size: 1
    # 포워더 전용: 상류(프록시·퍼블릭)가 재귀 응답을 주므로 검증기(validator) 모듈을 뺀다.
    # 프록시를 통과하는 DNSSEC 체인을 못 쫓아 SERVFAIL 나는 것을 방지(iterator 만).
    module-config: "iterator"
    # 인기 이름을 만료 전 미리 갱신 → serve-expired 로 내줄 "마지막 양호 A" 가 항상 신선하다.
    prefetch: yes
    # VM NAT 에 IPv6 상류가 없을 수 있으므로 v6 조회 억제(스퓨리어스 지연 방지).
    do-ip6: no
    qname-minimisation: no

# OrbStack 내부 이름은 OrbStack DNS 프록시가 계속 해석한다. 실측(2026-09-11, dw-ci):
#   · orb.local    — VM/컨테이너 이름
#   · orb.internal  — 호스트 별칭 (host.orb.internal 이 프록시로 rcode=0 응답 실측)
# (참고: 3레포 워크플로 어디에도 이 도메인 사용 없음 — 방어적 보존. 두 존 다 프록시로.)
forward-zone:
    name: "orb.local."
    forward-addr: 0.250.250.200
forward-zone:
    name: "orb.internal."
    forward-addr: 0.250.250.200

# 그 외 전부는 프록시를 우회해 퍼블릭 리졸버로 직접 나간다. 블립 시 이 경로는 «정직하게»
# 타임아웃(SYN 드롭)하므로 serve-expired 가 발동한다 — 프록시는 대신 NXDOMAIN 으로 번역해
# serve-expired 를 못 살린다(로컬 시뮬 실측, 2026-09-11).
forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
